name: cloud-security-platform

x-app-environment: &app-environment
  MYSQL_DSN: "cloud_app:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@tcp(mysql:3306)/cloud_security?parseTime=true&charset=utf8mb4&loc=UTC"
  SCAN_DATA_DIR: /data
  OPA_BIN: /usr/local/bin/opa
  TRIVY_BIN: /usr/local/bin/trivy
  OPA_POLICY: /app/policies/baseline.rego
  SUPPLY_CHAIN_MODE: ${SUPPLY_CHAIN_MODE:-disabled}
  COSIGN_BIN: /usr/local/bin/cosign
  COSIGN_IDENTITY: ${COSIGN_IDENTITY:-}
  COSIGN_ISSUER: ${COSIGN_ISSUER:-}
  SLSA_BUILDER_ID: ${SLSA_BUILDER_ID:-}
  TUF_ROOT: /data/sigstore

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: cloud_security
      MYSQL_USER: cloud_app
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - cloud_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  migrate:
    build: .
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      <<: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      <<: *app-environment
      HTTP_ADDR: 0.0.0.0:8082
    ports:
      - "127.0.0.1:${HTTP_PORT:-8082}:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  worker:
    build: .
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      <<: *app-environment
    volumes:
      - trivy_cache:/data/trivy-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  cloud_mysql:
  trivy_cache:
