{{- range $role := list "api" "worker" }}
{{- $config := index $.Values $role }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudguard.name" $ }}-{{ $role }}
spec:
  replicas: {{ $config.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/component: {{ $role }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/component: {{ $role }}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/component: {{ $role }}}
      containers:
        - name: {{ $role }}
          image: {{ include "cloudguard.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/usr/local/bin/{{ $role }}"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports:
            - {name: http, containerPort: {{ if eq $role "api" }}8082{{ else }}8083{{ end }}}
          env:
            {{- include "cloudguard.env" $ | nindent 12 }}
            - name: {{ if eq $role "api" }}HTTP_ADDR{{ else }}WORKER_HTTP_ADDR{{ end }}
              value: {{ if eq $role "api" }}"0.0.0.0:8082"{{ else }}"0.0.0.0:8083"{{ end }}
            - name: MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.runtimeSecret is required" $.Values.database.runtimeSecret }}
                  key: MYSQL_DSN
          {{- with $.Values.extraEnvFrom }}
          envFrom: {{ toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources: {{ toYaml $config.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            {{- with $.Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ $.Values.worker.dataSizeLimit }}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        {{- with $.Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloudguard.name" $ }}-{{ $role }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/component: {{ $role }}}
{{- end }}
