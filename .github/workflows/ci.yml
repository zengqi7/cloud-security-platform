name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: cloud_security
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --protocol=tcp -proot-test-password --silent"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install verified OPA
        shell: bash
        run: |
          url="https://github.com/open-policy-agent/opa/releases/download/v1.21.1/opa_linux_amd64_static"
          curl -fsSL "$url" -o /tmp/opa
          expected="$(curl -fsSL "$url.sha256" | awk '{print $1}')"
          echo "$expected  /tmp/opa" | sha256sum -c -
          chmod +x /tmp/opa
      - name: Unit and policy tests
        env:
          OPA_BIN: /tmp/opa
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Store integration tests
        env:
          INTEGRATION_MYSQL_DSN: root:root-test-password@tcp(127.0.0.1:3306)/cloud_security?parseTime=true&charset=utf8mb4&loc=UTC
        run: go test -race -tags=integration ./integration

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build scanner image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: cloud-security-platform:ci
