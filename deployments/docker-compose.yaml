name: cloud-security-platform

x-app-environment: &app-environment
  MYSQL_DSN: "cloud_app:${MYSQL_PASSWORD:-cloud-app-local-only}@tcp(mysql:3306)/cloud_security?parseTime=true&charset=utf8mb4&loc=UTC"
  SCAN_DATA_DIR: /data
  OPA_BIN: /usr/local/bin/opa
  TRIVY_BIN: /usr/local/bin/trivy
  OPA_POLICY: /app/policies/baseline.rego

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-cloud-root-local-only}"
      MYSQL_DATABASE: cloud_security
      MYSQL_USER: cloud_app
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-cloud-app-local-only}"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - cloud_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ..
    environment:
      <<: *app-environment
      HTTP_ADDR: 0.0.0.0:8082
      SCAN_API_TOKENS: '${SCAN_API_TOKENS:-{"acme":"acme-local-token-change-me"}}'
    ports:
      - "127.0.0.1:${HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ..
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      <<: *app-environment
    volumes:
      - trivy_cache:/data/trivy-cache
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cloud_mysql:
  trivy_cache:
